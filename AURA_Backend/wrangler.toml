name = "aura-backend"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Audio files are stored in Supabase Storage (same project as your Postgres
# database), NOT Cloudflare R2 — R2 requires a card on file even for its
# free tier, Supabase Storage's free tier (1GB) doesn't. No binding needed
# here since the Worker talks to Supabase Storage over its REST API using
# the same SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets already used
# for the database — see .dev.vars.example.

# Non-secret config. Secrets (API keys) are NOT put here — see .dev.vars.example
# for local dev and use `wrangler secret put <NAME>` for production.
[vars]
ENVIRONMENT = "development"
# Optional: browser origins allowed by CORS, comma-separated (defaults to the local Expo web
# dev servers outside production). The phone app doesn't use CORS.
# ALLOWED_ORIGINS = "https://your-web-app.example.com"

# Per-user rate limits (see src/lib/rateLimit.ts). namespace_id is any number unique in the account.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Tighter limit for endpoints that call OpenAI (natural-language search, mood input).
[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
